    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => console.log('SW enregistré:', registration))
            .catch((error) => console.log('Erreur SW:', error));
        });
      }
    </script>
